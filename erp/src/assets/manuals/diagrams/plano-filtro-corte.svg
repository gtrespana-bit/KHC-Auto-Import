<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- KHC Auto Import · Plano técnico de taller — corte del alojamiento del filtro (cartucho).
       Geometría tipo familia EA211 (elemento 04E 115 561): tapa roscada + junta tórica + cartucho. -->
  <rect width="920" height="560" fill="#f6f1e7"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">PLANO 3 · Corte esquemático — alojamiento del filtro de aceite (cartucho)</text>
  <text x="24" y="56" font-size="12" fill="#4b5563">VW Golf VII · 1.5 TSI EVO (EA211 evo) · tipo de filtro de la familia: elemento de papel con tapa roscada</text>
  <line x1="24" y1="68" x2="896" y2="68" stroke="#9c8a6a" stroke-width="1.5"/>

  <!-- Cuerpo del alojamiento -->
  <path d="M 300 200 L 300 430 Q 300 450 320 450 L 480 450 Q 500 450 500 430 L 500 200" fill="#efe8d8" stroke="#374151" stroke-width="2.5"/>
  <text x="400" y="480" text-anchor="middle" font-size="10" fill="#6b5b3e">cuerpo del alojamiento — montado en el bloque/culata</text>

  <!-- Rosca cuerpo -->
  <g stroke="#374151" stroke-width="1.6">
    <line x1="300" y1="210" x2="288" y2="218"/><line x1="300" y1="222" x2="288" y2="230"/>
    <line x1="300" y1="234" x2="288" y2="242"/><line x1="300" y1="246" x2="288" y2="254"/>
    <line x1="500" y1="210" x2="512" y2="218"/><line x1="500" y1="222" x2="512" y2="230"/>
    <line x1="500" y1="234" x2="512" y2="242"/><line x1="500" y1="246" x2="512" y2="254"/>
  </g>

  <!-- Cartucho (elemento de papel) -->
  <g>
    <rect x="330" y="270" width="140" height="150" rx="6" fill="#fffdf8" stroke="#b45309" stroke-width="2"/>
    <g stroke="#d9a066" stroke-width="1.4">
      <line x1="345" y1="278" x2="345" y2="412"/><line x1="360" y1="278" x2="360" y2="412"/>
      <line x1="375" y1="278" x2="375" y2="412"/><line x1="390" y1="278" x2="390" y2="412"/>
      <line x1="405" y1="278" x2="405" y2="412"/><line x1="420" y1="278" x2="420" y2="412"/>
      <line x1="435" y1="278" x2="435" y2="412"/><line x1="450" y1="278" x2="450" y2="412"/>
    </g>
    <rect x="376" y="270" width="48" height="150" fill="#e8e0cf" stroke="#374151" stroke-width="1.5"/>
    <line x1="400" y1="345" x2="620" y2="345" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="632" cy="345" r="12" fill="#b45309"/>
    <text x="632" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <text x="652" y="340" font-size="11" font-weight="700" fill="#1f2937">Elemento de cartucho</text>
    <text x="652" y="356" font-size="10" fill="#4b5563">montar en el mismo sentido que salió · EA211: 04E 115 561</text>
    <rect x="652" y="362" width="150" height="14" rx="3" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="727" y="372" text-anchor="middle" font-size="8.5" font-weight="700" fill="#854d0e">REF. POR CONFIRMAR (VIN)</text>
  </g>

  <!-- Tapa con nervaduras -->
  <g>
    <rect x="290" y="150" width="220" height="52" rx="8" fill="#d9d2c2" stroke="#374151" stroke-width="2.5"/>
    <g stroke="#374151" stroke-width="1.6">
      <line x1="310" y1="150" x2="310" y2="142"/><line x1="330" y1="150" x2="330" y2="142"/>
      <line x1="350" y1="150" x2="350" y2="142"/><line x1="370" y1="150" x2="370" y2="142"/>
      <line x1="390" y1="150" x2="390" y2="142"/><line x1="410" y1="150" x2="410" y2="142"/>
      <line x1="430" y1="150" x2="430" y2="142"/><line x1="450" y1="150" x2="450" y2="142"/>
      <line x1="470" y1="150" x2="470" y2="142"/><line x1="490" y1="150" x2="490" y2="142"/>
    </g>
    <line x1="400" y1="150" x2="620" y2="120" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="632" cy="116" r="12" fill="#b45309"/>
    <text x="632" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
    <text x="652" y="110" font-size="11" font-weight="700" fill="#1f2937">Tapa con nervaduras (llave ≈ 32 mm)</text>
    <text x="652" y="126" font-size="10" fill="#4b5563">apriete final 25 Nm · progresivo — la tapa es de plástico</text>
    <rect x="652" y="132" width="118" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
    <text x="711" y="142" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">PAR ORIENTATIVO · EA211</text>
  </g>

  <!-- Junta tórica -->
  <g>
    <rect x="290" y="202" width="220" height="12" rx="6" fill="#b45309" stroke="#374151" stroke-width="1.5"/>
    <line x1="290" y1="208" x2="180" y2="208" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="168" cy="208" r="12" fill="#b45309"/>
    <text x="168" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
    <text x="24" y="184" font-size="11" font-weight="700" fill="#1f2937">Junta tórica NUEVA</text>
    <text x="24" y="200" font-size="10" fill="#4b5563">en su alojamiento de la tapa (nunca en la rosca)</text>
    <text x="24" y="232" font-size="10" fill="#4b5563">untar con aceite limpio antes de montar</text>
    <rect x="24" y="240" width="86" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
    <text x="67" y="250" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">SIEMPRE SUSTITUIR</text>
  </g>

  <!-- Circuito de aceite -->
  <g>
    <path d="M 180 320 C 210 320, 220 320, 250 318" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrb)"/>
    <path d="M 550 380 C 520 392, 510 392, 480 392" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrb)"/>
    <text x="120" y="316" font-size="10" fill="#2563eb">aceite sucio</text>
    <text x="560" y="396" font-size="10" fill="#2563eb">aceite filtrado → motor</text>
    <defs>
      <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 z" fill="#2563eb"/>
      </marker>
    </defs>
  </g>

  <!-- Aviso apriete -->
  <g>
    <rect x="120" y="450" width="420" height="60" rx="8" fill="#fffdf8" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="136" y="474" font-size="11" font-weight="700" fill="#991b1b">⚠ APRIETE</text>
    <text x="136" y="494" font-size="10" fill="#4b5563">Más de 25 Nm o llave larga parte la rosca del alojamiento (reparación cara).</text>
  </g>

  <!-- Leyenda -->
  <rect x="560" y="450" width="336" height="60" rx="8" fill="#fffdf8" stroke="#9c8a6a"/>
  <text x="576" y="472" font-size="10" font-weight="700" fill="#1f2937">FUENTES:</text>
  <text x="576" y="490" font-size="9.5" fill="#4b5563">Geometría de cartucho tipo EA211 (tapa roscada + junta tórica</text>
  <text x="576" y="502" font-size="9.5" fill="#4b5563">+ elemento). Pares: manual de taller [orientativo].</text>
</svg>
