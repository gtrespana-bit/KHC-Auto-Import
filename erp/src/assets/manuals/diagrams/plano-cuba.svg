<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- KHC Auto Import · Plano técnico de taller — vista inferior, cuba y drenaje. -->
  <rect width="920" height="560" fill="#f6f1e7"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">PLANO 2 · Vista inferior — cuba de aceite y drenaje</text>
  <text x="24" y="56" font-size="12" fill="#4b5563">VW Golf VII · 1.5 TSI EVO (EA211 evo) · vehículo elevado, visto desde debajo</text>
  <line x1="24" y1="68" x2="896" y2="68" stroke="#9c8a6a" stroke-width="1.5"/>

  <!-- Orientación -->
  <g>
    <rect x="756" y="80" width="140" height="70" rx="6" fill="#fffdf8" stroke="#9c8a6a"/>
    <text x="826" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">ORIENTACIÓN</text>
    <text x="826" y="118" text-anchor="middle" font-size="10" fill="#4b5563">vista desde abajo</text>
    <text x="826" y="134" text-anchor="middle" font-size="10" fill="#4b5563">frente del coche a la derecha</text>
  </g>

  <!-- Suelo / escudo inferior -->
  <rect x="80" y="90" width="620" height="330" rx="16" fill="#fffdf8" stroke="#9c8a6a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="110" y="118" font-size="11" font-weight="700" fill="#8a7a5c">ESCUDO INFERIOR DEL MOTOR (si lo hay)</text>
  <text x="110" y="136" font-size="10" fill="#8a7a5c">retirar los tornillos Torx T25/T30 (rosca a plástico)</text>
  <g fill="#9c8a6a">
    <circle cx="120" cy="160" r="5"/><circle cx="660" cy="160" r="5"/>
    <circle cx="120" cy="390" r="5"/><circle cx="660" cy="390" r="5"/>
    <circle cx="390" cy="160" r="5"/><circle cx="390" cy="390" r="5"/>
  </g>

  <!-- Cuba -->
  <rect x="200" y="170" width="380" height="180" rx="26" fill="#efe8d8" stroke="#374151" stroke-width="2.5"/>
  <!-- nervaduras -->
  <g stroke="#c9bda2" stroke-width="2">
    <line x1="240" y1="200" x2="240" y2="320"/>
    <line x1="290" y1="195" x2="290" y2="325"/>
    <line x1="340" y1="192" x2="340" y2="328"/>
    <line x1="390" y1="190" x2="390" y2="330"/>
    <line x1="440" y1="192" x2="440" y2="328"/>
    <line x1="490" y1="195" x2="490" y2="325"/>
  </g>
  <text x="390" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">CUBA (CÁRTER) DE ACEITE</text>

  <!-- 1 Tapón de drenaje -->
  <g>
    <polygon points="368,300 384,290 400,300 400,318 384,328 368,318" fill="#fff" stroke="#374151" stroke-width="2"/>
    <line x1="384" y1="328" x2="384" y2="380" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="384" cy="392" r="12" fill="#b45309"/>
    <text x="384" y="397" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
    <text x="410" y="396" font-size="11" font-weight="700" fill="#1f2937">Tapón de drenaje M14×1,5 — 30 Nm · NUEVO siempre</text>
  </g>

  <!-- Chorro -->
  <g>
    <path d="M 384 330 C 384 350, 380 360, 378 372" stroke="#4b5563" stroke-width="3" fill="none" stroke-dasharray="2 4"/>
    <path d="M 372 372 L 386 372 L 380 386 z" fill="#4b5563"/>
  </g>

  <!-- Bandeja -->
  <g>
    <rect x="250" y="440" width="300" height="56" rx="10" fill="#e8e0cf" stroke="#9c8a6a" stroke-width="2"/>
    <text x="400" y="464" text-anchor="middle" font-size="11" font-weight="700" fill="#6b5b3e">BANDEJA DE DRENAJE ≥ 6 L</text>
    <text x="400" y="482" text-anchor="middle" font-size="10" fill="#8a7a5c">dejar escurrir 10-15 min · aceite caliente (guantes y gafas)</text>
    <line x1="384" y1="404" x2="384" y2="438" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr2)"/>
    <defs>
      <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 z" fill="#b45309"/>
      </marker>
    </defs>
  </g>

  <!-- 2 Aviso junta -->
  <g>
    <rect x="620" y="180" width="270" height="120" rx="8" fill="#fffdf8" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="646" cy="206" r="12" fill="#b45309"/>
    <text x="646" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
    <text x="666" y="211" font-size="11" font-weight="700" fill="#1f2937">Junta integrada del tapón</text>
    <text x="636" y="234" font-size="10" fill="#4b5563">El tapón es de un solo uso: el conjunto tapón-junta</text>
    <text x="636" y="250" font-size="10" fill="#4b5563">se sustituye completo. Nunca reutilizar el antiguo.</text>
    <text x="636" y="272" font-size="10" fill="#4b5563">Limpiar la rosca y el asiento antes de montar el nuevo.</text>
    <rect x="636" y="280" width="86" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
    <text x="679" y="290" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">VERIFICADO · foto Golf VII</text>
  </g>

  <!-- Nota posición -->
  <g>
    <rect x="620" y="320" width="270" height="100" rx="8" fill="#fffdf8" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="636" y="346" font-size="11" font-weight="700" fill="#991b1b">POSICIÓN DEL TAPÓN · POR CONFIRMAR</text>
    <text x="636" y="368" font-size="10" fill="#4b5563">El tapón va en la zona más baja de la cuba; su punto</text>
    <text x="636" y="384" font-size="10" fill="#4b5563">exacto varía con la cuba montada. Confirmar a simple</text>
    <text x="636" y="400" font-size="10" fill="#4b5563">vista bajo el coche antes de aflojar (cara hexagonal).</text>
  </g>

  <!-- Leyenda -->
  <rect x="40" y="512" width="856" height="34" rx="8" fill="#fffdf8" stroke="#9c8a6a"/>
  <text x="56" y="534" font-size="10" fill="#4b5563">FUENTES: drenaje real en cuba de Golf VII (foto de taller, guía Autodoc 24083) · par M14×1,5 30 Nm: manual de taller familia EA211 [orientativo] · escudo inferior y tornillos: según equipamiento.</text>
</svg>
