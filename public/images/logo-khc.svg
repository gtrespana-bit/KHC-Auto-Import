<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="KHC Auto Import">
  <defs>
    <linearGradient id="khcSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#8f9aa8"/>
    </linearGradient>
    <linearGradient id="khcGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a7440"/>
      <stop offset="0.5" stop-color="#c9ab62"/>
      <stop offset="1" stop-color="#8a7440"/>
    </linearGradient>
  </defs>

  <!-- Silueta del coche -->
  <g fill="none" stroke="url(#khcSilver)" stroke-linecap="round">
    <path d="M32 116 C 118 96, 168 58, 262 54 C 352 50, 424 84, 486 112" stroke-width="7"/>
    <path d="M14 128 C 150 106, 330 102, 506 118" stroke-width="5"/>
    <path d="M196 92 C 226 68, 300 64, 344 90" stroke-width="4" opacity="0.85"/>
  </g>

  <!-- KHC -->
  <text x="260" y="232" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="600" letter-spacing="8" fill="url(#khcSilver)">KHC</text>

  <!-- Arco dorado superior -->
  <path d="M118 262 C 200 250, 320 250, 402 262" fill="none" stroke="url(#khcGold)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- AUTO IMPORT -->
  <text x="262" y="305" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" letter-spacing="20" fill="url(#khcSilver)">AUTO IMPORT</text>

  <!-- Ticks dorados laterales -->
  <path d="M52 292 L104 289" stroke="url(#khcGold)" stroke-width="5" stroke-linecap="round"/>
  <path d="M416 289 L468 292" stroke="url(#khcGold)" stroke-width="5" stroke-linecap="round"/>

  <!-- Arco dorado inferior -->
  <path d="M118 322 C 200 334, 320 334, 402 322" fill="none" stroke="url(#khcGold)" stroke-width="3.5" stroke-linecap="round"/>
</svg>
